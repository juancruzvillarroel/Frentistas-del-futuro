<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frentistas del Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">
      <h1>Frentistas del Futuro</h1>
      <small>calle Feria · Sevilla · 2126 <b class="cursor">▮</b></small>
    </div>
    <input id="nombre" class="nombre" spellcheck="false" aria-label="Nombre de la casa">
    <div class="acciones">
      <button class="btn prim" id="b-remix" title="Arma una fachada al azar con piezas del archivo">⟲ Remix del archivo</button>
      <button class="btn" id="b-original" title="Volver a la casa chorizo de partida">Casa chorizo</button>
      <button class="btn" id="b-nueva">Nueva</button>
      <button class="btn" id="b-guardar">Guardar</button>
      <button class="btn" id="b-abrir">Abrir</button>
      <button class="btn" id="b-png">Lámina PNG</button>
      <button class="btn" id="b-svg">SVG</button>
      <input type="file" id="f-abrir" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="win archivo">
    <div class="win-title"><i class="box"></i><span>Archivo · catálogo infinito</span><button class="plegar" id="b-plegar" title="Plegar / desplegar">▾</button></div>
    <div class="archivo-mapa" id="archivo-mapa"></div>
  </section>

  <main>
    <section class="win mesa">
      <div class="win-title"><i class="box"></i><span>Mesa de trabajo</span></div>
      <nav class="tabs" id="vistas">
        <button data-view="planta">Planta</button>
        <button data-view="corte">Corte A–A</button>
        <button data-view="fachada">Fachada</button>
        <button data-view="lamina">Lámina</button>
      </nav>
      <div class="stage" id="stage"></div>
      <div class="hint" id="hint"></div>
    </section>
    <aside class="win ficha">
      <div class="win-title"><i class="box"></i><span>Ficha</span></div>
      <div class="ficha-body" id="ficha-body"></div>
    </aside>
  </main>

  <footer class="status" id="status"></footer>
</div>
<div id="toast" role="status"></div>
<script src="js/catalogo.js"></script>
<script src="js/archivo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
