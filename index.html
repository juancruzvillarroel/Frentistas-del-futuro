<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frentistas del Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
<header class="topbar">
  <div class="logo">
    <h1>Frentistas del Futuro</h1>
    <small>calle Feria · Sevilla · 2126 <b class="cursor">▮</b></small>
  </div>
  <label class="nombre-casa">Tu casa<input id="nombre" class="nombre" spellcheck="false"></label>
  <div class="acciones">
    <button class="btn prim" id="b-remix" title="Arma una casa entera al azar: planta, corte y fachada">⟲ Remix del archivo</button>
    <button class="btn" id="b-original" title="Volver a la casa chorizo de partida">Casa chorizo</button>
    <button class="btn" id="b-nueva" title="Empezar con el lote vacío">Casa vacía</button>
    <button class="btn" id="b-guardar" title="Descargar la casa como archivo .json">Guardar</button>
    <button class="btn" id="b-abrir" title="Abrir una casa guardada">Abrir</button>
    <input type="file" id="f-abrir" accept=".json,application/json" hidden>
  </div>
</header>

<nav class="pasos" id="pasos">
  <button data-paso="patios"><i>1</i><span>Patios</span></button>
  <button data-paso="ambientes"><i>2</i><span>Ambientes</span></button>
  <button data-paso="fachada"><i>3</i><span>Fachada</span></button>
  <button data-paso="techos"><i>4</i><span>Techos y corte</span></button>
  <button data-paso="lamina"><i>5</i><span>Lámina</span></button>
</nav>

<main>
  <section class="intro">
    <h2 id="paso-titulo"></h2>
    <p id="paso-texto"></p>
  </section>

  <section class="win" id="archivo">
    <div class="win-title"><i class="box"></i><span>Archivo · catálogo infinito</span></div>
    <p class="win-ayuda">Hacé clic en un nodo para desplegar sus opciones. El número rojo dice cuántas veces lo usaste en tu casa.</p>
    <div class="archivo-mapa" id="archivo-mapa"></div>
  </section>

  <section class="exportar" id="exportar" hidden>
    <button class="btn prim grande" id="b-png">Descargar lámina (PNG)</button>
    <button class="btn grande" id="b-svg">Descargar dibujo (SVG)</button>
  </section>

  <section class="trabajo" id="trabajo">
    <div class="niveles" id="niveles" hidden></div>
    <div class="aviso" id="aviso"></div>
    <div class="mesa-grid">
      <section class="win mesa">
        <div class="win-title"><i class="box"></i><span id="mesa-titulo">Planta</span></div>
        <div class="stage" id="stage"></div>
      </section>
      <aside class="win ficha">
        <div class="win-title"><i class="box"></i><span>Ficha</span></div>
        <div class="ficha-body" id="ficha-body"></div>
      </aside>
    </div>
    <div class="siguiente"><button class="btn prim grande" id="b-siguiente"></button></div>
  </section>
</main>

<footer class="status" id="status"></footer>
<div id="toast" role="status"></div>
<script src="js/catalogo.js?v=10"></script>
<script src="js/archivo.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
