<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Visor de recortes</title>
<style>body{margin:0;background:#111;color:#eee;font:11px sans-serif;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
canvas{display:block;width:100%;max-height:calc(100vh / var(--filas));object-fit:contain}</style></head>
<body><script>
// Uso: ver.html?f=File:A.jpg||File:B.jpg&r=x0,y0,x1,y1;...||...&z=zona  (fracciones 0–1)
const q = new URLSearchParams(location.search), fs = q.get('f').split('||'), rs = (q.get('r') || '').split('||'), zs = (q.get('z') || '').split('||');
const n = fs.length > 1 ? 2 : 1;
document.body.style.setProperty('--n', n); document.body.style.setProperty('--filas', Math.ceil(fs.length / n));
fs.forEach(async (f, i) => {
  const c = document.createElement('canvas'); document.body.appendChild(c);
  const recs = (rs[i] || '').split(';').filter(Boolean).map(s => s.split(',').map(Number));
  const [zx0, zy0, zx1, zy1] = (zs[i] || '0,0,1,1').split(',').map(Number);
  const j = await (await fetch(`https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(f)}&prop=imageinfo&iiprop=url&iiurlwidth=2000&format=json&origin=*`)).json();
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = Object.values(j.query.pages)[0].imageinfo[0].thumburl; await img.decode();
  const sw = img.width * (zx1 - zx0), sh = img.height * (zy1 - zy0), k = Math.min(1, 1400 / Math.max(sw, sh));
  c.width = sw * k; c.height = sh * k;
  const g = c.getContext('2d');
  g.drawImage(img, img.width * zx0, img.height * zy0, sw, sh, 0, 0, c.width, c.height);
  const X = fx => (fx - zx0) / (zx1 - zx0) * c.width, Y = fy => (fy - zy0) / (zy1 - zy0) * c.height;
  g.font = `bold ${Math.round(c.width / 28)}px sans-serif`;
  const paso = (zx1 - zx0) > .5 ? .05 : .01;
  for (let v = 0; v <= 1.0001; v += paso) {
    const fuerte = Math.abs(v * 10 - Math.round(v * 10)) < 1e-6;
    g.strokeStyle = fuerte ? 'rgba(255,230,0,.85)' : 'rgba(255,230,0,.35)'; g.lineWidth = fuerte ? 3 : 1.5;
    g.fillStyle = '#ff0';
    if (v >= zx0 && v <= zx1) { g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), c.height); g.stroke(); if (fuerte) g.fillText(v.toFixed(1).slice(1), X(v) + 3, c.width / 25); }
    if (v >= zy0 && v <= zy1) { g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(c.width, Y(v)); g.stroke(); if (fuerte) g.fillText(v.toFixed(1).slice(1), 3, Y(v) - 3); }
  }
  g.strokeStyle = '#f0f'; g.lineWidth = 5;
  recs.forEach(([a, b, cc, d]) => g.strokeRect(X(a), Y(b), X(cc) - X(a), Y(d) - Y(b)));
  g.fillStyle = '#0ff'; g.fillText(String(i), c.width - c.width / 14, c.width / 12);
});
</script></body></html>
