<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hoja de contactos</title>
<style>body{margin:0;font:10px sans-serif;background:#222;color:#ddd}#g{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:2px}
figure{margin:0;background:#333;position:relative}img{width:100%;height:112px;object-fit:contain;display:block;background:#111}
b{position:absolute;top:1px;left:1px;background:#e3a640;color:#000;padding:0 3px;font-size:11px}figcaption{display:none}</style></head>
<body><div id="g"></div><script>
// Uso: hoja.html?cat=Doors_in_Buenos_Aires&desde=0
const q = new URLSearchParams(location.search), cat = q.get('cat'), desde = +(q.get('desde') || 0), cuantos = +(q.get('n') || 60);
async function todo() {
  let lista = [];
  if (q.get('buscar')) for (const b of q.get('buscar').split('|')) {
    const u = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(b + ' filetype:bitmap')}&gsrnamespace=6&gsrlimit=${cuantos}&prop=imageinfo&iiprop=url|extmetadata|size&iiurlwidth=300&format=json&origin=*`;
    const j = await (await fetch(u)).json();
    lista.push(...Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index));
  }
  for (const c of (cat || '').split('|').filter(Boolean)) {
    let cont = '', parte = [];
    do {
      const u = `https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=Category:${c}&gcmtype=file&gcmlimit=200&prop=imageinfo&iiprop=url|extmetadata|size&iiurlwidth=300&format=json&origin=*${cont}`;
      const j = await (await fetch(u)).json();
      parte.push(...Object.values(j.query?.pages || {}));
      cont = j.continue ? `&gcmcontinue=${encodeURIComponent(j.continue.gcmcontinue)}` : '';
    } while (cont && parte.length < desde + cuantos);
    parte.sort((a, b) => a.title.localeCompare(b.title));
    lista.push(...parte);
  }
  window.LISTA = lista;
  document.getElementById('g').innerHTML = lista.slice(desde, desde + +(q.get('max') || 56)).map((p, i) => {
    const ii = p.imageinfo?.[0] || {}, lic = ii.extmetadata?.LicenseShortName?.value || '?';
    return `<figure><b>${desde + i}</b><img src="${ii.thumburl}"><figcaption>${lic} · ${p.title.slice(5, 60)}</figcaption></figure>`;
  }).join('');
}
todo();
</script></body></html>
